<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710">
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- AWS Region boundary -->
        <rect x="160" y="40" width="820" height="560" rx="12" fill="rgba(251, 191, 36, 0.05)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
        <text x="172" y="54" fill="#fbbf24" font-size="10" font-weight="600">AWS Region: us-east-1</text>
        <text x="172" y="68" fill="#fbbf24" font-size="8">public subnets · no NAT · no ALB</text>

        <!-- ============ ARROWS (behind boxes) ============ -->
        <!-- Client -> proxy (routed below Lambda; label padded down off the box) -->
        <line x1="140" y1="166" x2="418" y2="166" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="280" y="163" fill="#22d3ee" font-size="11" text-anchor="middle">/v1/chat/completions + /v1/models</text>

        <!-- proxy -> Bedrock -->
        <line x1="630" y1="118" x2="698" y2="118" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="663" y="110" fill="#fbbf24" font-size="11" text-anchor="middle">Converse</text>

        <!-- proxy -> S3 lineage (vertical, dashed) -->
        <line x1="525" y1="170" x2="525" y2="258" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
        <text x="512" y="224" fill="#a78bfa" font-size="11" text-anchor="end">lineage write</text>

        <!-- proxy -> CloudWatch (bent/orthogonal elbow, dashed — routed through the clear right channel) -->
        <path d="M 630 150 L 665 150 L 665 300 L 698 300" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
        <text x="650" y="222" fill="#fbbf24" font-size="11" text-anchor="end">metrics</text>

        <!-- SSM -> proxy (config, bent up the left channel, bottom-entry so no crossing) -->
        <path d="M 350 455 L 390 455 L 390 205 L 500 205 L 500 171" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowhead)"/>
        <text x="382" y="228" fill="#fbbf24" font-size="11" text-anchor="end">config</text>

        <!-- CloudWatch Budget -> CloudWatch (cost alarm, bent through the clear gap) -->
        <path d="M 525 430 L 525 380 L 825 380 L 825 347" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowhead)"/>
        <text x="700" y="372" fill="#fbbf24" font-size="11" text-anchor="middle">cost alarm</text>

        <!-- Lambda Function URL -> proxy (ingress, clean horizontal) -->
        <line x1="350" y1="112" x2="418" y2="112" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="384" y="104" fill="#fbbf24" font-size="11" text-anchor="middle">ingress</text>

        <!-- ============ COMPONENTS ============ -->

        <!-- Client (External) -->
        <rect x="20" y="75" width="120" height="110" fill="#0f172a"/>
        <rect x="20" y="75" width="120" height="110" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="80" y="110" fill="white" font-size="11" font-weight="600" text-anchor="middle">Hermes</text>
        <text x="80" y="126" fill="#94a3b8" font-size="9" text-anchor="middle">OpenAI SDK</text>
        <text x="80" y="140" fill="#94a3b8" font-size="9" text-anchor="middle">A2A agents</text>
        <text x="80" y="158" fill="#94a3b8" font-size="8" text-anchor="middle">(clients)</text>

        <!-- Lambda Function URL (AWS/cloud) -->
        <rect x="200" y="80" width="150" height="60" fill="#0f172a"/>
        <rect x="200" y="80" width="150" height="60" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="275" y="103" fill="white" font-size="10" font-weight="600" text-anchor="middle">Lambda</text>
        <text x="275" y="118" fill="#94a3b8" font-size="8" text-anchor="middle">Function URL</text>
        <text x="275" y="130" fill="#fbbf24" font-size="7" text-anchor="middle">free-tier health</text>

        <!-- Proxy (ECS Fargate, backend) -->
        <rect x="420" y="80" width="210" height="90" fill="#0f172a"/>
        <rect x="420" y="80" width="210" height="90" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="525" y="105" fill="white" font-size="11" font-weight="600" text-anchor="middle">OpenAI → Bedrock proxy</text>
        <text x="525" y="124" fill="#94a3b8" font-size="9" text-anchor="middle">ECS Fargate · FastAPI :8000</text>
        <text x="525" y="140" fill="#34d399" font-size="8" text-anchor="middle">/v1/chat/completions + /v1/models</text>

        <!-- Bedrock (AWS/cloud, the model) -->
        <rect x="700" y="80" width="250" height="110" fill="#0f172a"/>
        <rect x="700" y="80" width="250" height="110" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="825" y="105" fill="white" font-size="11" font-weight="600" text-anchor="middle">Amazon Bedrock</text>
        <text x="825" y="124" fill="#94a3b8" font-size="9" text-anchor="middle">model set via bedrock_model_id</text>
        <text x="825" y="140" fill="#94a3b8" font-size="8" text-anchor="middle">default: us.anthropic.claude-opus-4-6-v1</text>
        <text x="825" y="156" fill="#fbbf24" font-size="8" text-anchor="middle">sole model provider</text>

        <!-- S3 lineage (Database) -->
        <rect x="420" y="260" width="210" height="85" fill="#0f172a"/>
        <rect x="420" y="260" width="210" height="85" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="525" y="286" fill="white" font-size="11" font-weight="600" text-anchor="middle">S3 lineage bucket</text>
        <text x="525" y="304" fill="#94a3b8" font-size="9" text-anchor="middle">versioning + Object Lock</text>
        <text x="525" y="318" fill="#a78bfa" font-size="8" text-anchor="middle">WORM audit / provenance</text>

        <!-- CloudWatch (AWS/cloud, observability) -->
        <rect x="700" y="260" width="250" height="85" fill="#0f172a"/>
        <rect x="700" y="260" width="250" height="85" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="825" y="286" fill="white" font-size="11" font-weight="600" text-anchor="middle">CloudWatch</text>
        <text x="825" y="304" fill="#94a3b8" font-size="8" text-anchor="middle">model-invocation logs + metrics</text>
        <text x="825" y="320" fill="#fbbf24" font-size="8" text-anchor="middle">latency / error / token alarms</text>

        <!-- SSM Parameter Store (AWS/cloud) -->
        <rect x="170" y="430" width="180" height="60" fill="#0f172a"/>
        <rect x="170" y="430" width="180" height="60" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="260" y="455" fill="white" font-size="10" font-weight="600" text-anchor="middle">SSM Parameter Store</text>
        <text x="260" y="471" fill="#94a3b8" font-size="8" text-anchor="middle">config / model id (free)</text>

        <!-- Budget alarm (AWS/cloud) -->
        <rect x="420" y="430" width="210" height="60" fill="#0f172a"/>
        <rect x="420" y="430" width="210" height="60" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="525" y="455" fill="white" font-size="10" font-weight="600" text-anchor="middle">CloudWatch Budget</text>
        <text x="525" y="471" fill="#94a3b8" font-size="8" text-anchor="middle">$5 / month alarm</text>

        <!-- ============ LEGEND (below all boundaries) ============ -->
        <text x="700" y="622" fill="white" font-size="10" font-weight="600">Legend</text>

        <rect x="700" y="632" width="16" height="10" rx="2" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1"/>
        <text x="742" y="640" fill="#94a3b8" font-size="8">Client</text>

        <rect x="700" y="648" width="16" height="10" rx="2" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1"/>
        <text x="742" y="656" fill="#94a3b8" font-size="8">App / proxy</text>

        <rect x="700" y="664" width="16" height="10" rx="2" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1"/>
        <text x="742" y="672" fill="#94a3b8" font-size="8">AWS service</text>

        <rect x="700" y="680" width="16" height="10" rx="2" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1"/>
        <text x="742" y="688" fill="#94a3b8" font-size="8">Data / lineage</text>
      </svg>